apiVersion: v1
kind: Pod
metadata:
  name: chaos-engine
spec:
  serviceAccountName: chaos-sa
  containers:
  - name: chaos
    image: devforge-chaos:latest
    imagePullPolicy: Never
    env:
    - name: TARGET_NAMESPACE
      value: default
    - name: CHAOS_EXPERIMENTS
      value: pod-kill
    - name: CHAOS_INTERVAL_SECONDS
      value: "60"
    # - name: CHAOS_DRY_RUN       # uncomment to only log what would happen
    #   value: "true"
  restartPolicy: Never
