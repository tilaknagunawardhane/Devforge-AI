# DevForge AI-SRE stack — everything free & open source, everything in Docker.
#
#   docker compose up -d --build                      # core stack (webhook, Ollama, Prometheus, Alertmanager, Grafana)
#   docker compose --profile k8s up -d --build        # + disposable k3s cluster, demo app, chaos engine
#
# Host ports: webhook 9090, Prometheus 9091, Alertmanager 9093, Grafana 3000, Ollama 11435.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # Chat model for RCAs + embedding model for runbook search
    entrypoint: ["/bin/sh", "-c", "ollama pull ${OLLAMA_MODEL:-llama3} && ollama pull ${EMBED_MODEL:-nomic-embed-text}"]
    restart: "no"

  webhook:
    build: ./devforge-webhook
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}   # set to enable Acknowledge / Restart buttons
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9090}
      DB_PATH: /data/incidents.db
      QDRANT_URL: http://qdrant:6333
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      RUNBOOK_DIR: /runbooks
      WEBHOOK_TOKEN_FILE: /run/secrets/webhook-token
      PROMETHEUS_URL: http://prometheus:9090
      KUBECONFIG: /kube/kubeconfig.yaml # only exists when the k8s profile is running
      KUBE_API_HOST: https://k3s:6443
    volumes:
      - ./monitoring/webhook-token:/run/secrets/webhook-token:ro
      - kubeconfig:/kube:ro
      - webhook-data:/data
      - ./runbooks:/runbooks:ro
    ports:
      - "9090:9090"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Vector database for runbook / past-incident retrieval (free and open source)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9091:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/webhook-token:/etc/alertmanager/webhook-token:ro
    ports:
      - "9093:9093"
    depends_on:
      - webhook

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  # ---------- profile "k8s": a throwaway Kubernetes cluster to attack ----------
  k3s:
    profiles: ["k8s"]
    image: rancher/k3s:v1.30.5-k3s1
    command: server --write-kubeconfig-mode=644 --tls-san=k3s --disable=traefik --disable=metrics-server
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    volumes:
      - kubeconfig:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 5s
      timeout: 5s
      retries: 30

  kube-seed:
    profiles: ["k8s"]
    image: rancher/k3s:v1.30.5-k3s1
    depends_on:
      k3s:
        condition: service_healthy
    environment:
      KUBECONFIG: /output/kubeconfig.yaml
    volumes:
      - kubeconfig:/output:ro
      - ./examples/k8s:/manifests:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until kubectl --server=https://k3s:6443 apply -f /manifests/demo-app.yaml; do sleep 3; done
        kubectl --server=https://k3s:6443 rollout status deployment/demo-app --timeout=180s
    restart: "no"

  chaos:
    profiles: ["k8s"]
    build: ./devforge-chaos
    depends_on:
      kube-seed:
        condition: service_completed_successfully
    environment:
      KUBECONFIG: /kube/kubeconfig.yaml
      KUBE_API_HOST: https://k3s:6443
      TARGET_NAMESPACE: default
      TARGET_SELECTOR: ${TARGET_SELECTOR:-}
      CHAOS_EXPERIMENTS: ${CHAOS_EXPERIMENTS:-pod-kill}   # pod-kill,cpu-stress,memory-stress,node-drain
      CHAOS_INTERVAL_SECONDS: ${CHAOS_INTERVAL_SECONDS:-60}
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-30}
      CHAOS_MAX_TARGETS: ${CHAOS_MAX_TARGETS:-1}
      CHAOS_DRY_RUN: ${CHAOS_DRY_RUN:-false}
      CHAOS_ALLOW_SINGLE_NODE_DRAIN: ${CHAOS_ALLOW_SINGLE_NODE_DRAIN:-false}
    volumes:
      - kubeconfig:/kube:ro
      - ./reports:/reports
    restart: on-failure

volumes:
  qdrant-data:
  webhook-data:
  ollama-data:
  grafana-data:
  kubeconfig:
