# DevForge AI-SRE stack — everything free & open source, everything in Docker.
#
#   docker compose up -d --build                      # core stack (webhook, Ollama, Prometheus, Alertmanager, Grafana)
#   docker compose --profile k8s up -d --build        # + disposable k3s cluster, demo app, chaos engine
#
# Host ports: webhook 9090, Prometheus 9091, Alertmanager 9093, Grafana 3000, Ollama 11435.

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: ollama:11434
    # Chat model for RCAs + embedding model for runbook search
    # A download from the public registry can fail for a moment; retry instead of failing the whole stack.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for attempt in 1 2 3 4 5; do
          if ollama pull ${OLLAMA_MODEL:-llama3} && ollama pull ${EMBED_MODEL:-nomic-embed-text}; then exit 0; fi
          if [ "$$attempt" -lt 5 ]; then
            echo "model download failed (attempt $$attempt of 5); retrying in 10 seconds" >&2
            sleep 10
          fi
        done
        echo "model download failed after 5 attempts" >&2
        exit 1
    restart: "no"

  webhook:
    build: ./devforge-webhook
    environment:
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}   # set to enable Acknowledge / Restart buttons
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:9090}
      DB_PATH: /data/incidents.db
      QDRANT_URL: http://qdrant:6333
      EMBED_MODEL: ${EMBED_MODEL:-nomic-embed-text}
      RUNBOOK_DIR: /runbooks
      # Auto-remediation: rules only PROPOSE; a person must approve (Slack button or POST /actions/<id>/approve)
      REMEDIATION_NAMESPACES: ${REMEDIATION_NAMESPACES:-default}   # empty = remediation disabled
      REMEDIATION_DRY_RUN: ${REMEDIATION_DRY_RUN:-false}
      REMEDIATION_COOLDOWN_SECONDS: ${REMEDIATION_COOLDOWN_SECONDS:-300}
      REMEDIATION_APPROVERS: ${REMEDIATION_APPROVERS:-}
      # Fix PRs: a dedicated token (NOT your personal GITHUB_TOKEN) with contents + pull-requests write
      GITHUB_TOKEN: ${WEBHOOK_GITHUB_TOKEN:-}
      GITHUB_API_URL: ${GITHUB_API_URL:-https://api.github.com}
      GITHUB_REPO_TEMPLATE: ${GITHUB_REPO_TEMPLATE:-}              # e.g. your-user/devforge-manifests-{deployment}
      WEBHOOK_TOKEN_FILE: /run/secrets/webhook-token
      PROMETHEUS_URL: http://prometheus:9090
      KUBECONFIG: /kube/kubeconfig.yaml # only exists when the k8s profile is running
      KUBE_API_HOST: https://k3s:6443
    volumes:
      - ./monitoring/webhook-token:/run/secrets/webhook-token:ro
      - kubeconfig:/kube:ro
      - webhook-data:/data
      - ./runbooks:/runbooks:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      ollama-pull:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web portal: service catalog + live status + incidents. Create services with the CLI from the
  # repository root so `./.devforge/catalog.json` exists (see "Using the CLI" in the README).
  portal:
    build: ./devforge-cli
    command: ["ui"]
    environment:
      DEVFORGE_CATALOG: /data/catalog.json
      DEVFORGE_WEBHOOK_URL: http://webhook:9090
      DEVFORGE_WEBHOOK_PUBLIC_URL: http://localhost:9090
      PROMETHEUS_URL: http://prometheus:9090
      GRAFANA_URL: http://localhost:3000
      ARGOCD_URL: ${ARGOCD_URL:-}
    volumes:
      - ./.devforge:/data:ro
    ports:
      - "127.0.0.1:8088:8088"
    depends_on:
      - webhook

  # Vector database for runbook / past-incident retrieval (free and open source)
  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes:
      - qdrant-data:/qdrant/storage

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9091:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./monitoring/webhook-token:/etc/alertmanager/webhook-token:ro
    ports:
      - "127.0.0.1:9093:9093"
    depends_on:
      - webhook

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  # ---------- profile "gitops": a local Git server so Argo CD can be tried without GitHub ----------
  # Used by gitops/demo.sh. The credentials it creates are for this local demo only.
  gitea:
    profiles: ["gitops"]
    image: gitea/gitea:1.22.6
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__server__ROOT_URL: http://localhost:3001/
    volumes:
      - gitea-data:/data
    ports:
      - "127.0.0.1:3001:3000"

  # ---------- profile "k8s": a throwaway Kubernetes cluster to attack ----------
  k3s:
    profiles: ["k8s"]
    image: rancher/k3s:v1.30.5-k3s1
    command: server --write-kubeconfig-mode=644 --tls-san=k3s --disable=traefik --disable=metrics-server
    privileged: true
    tmpfs:
      - /run
      - /var/run
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
    volumes:
      - kubeconfig:/output
    healthcheck:
      test: ["CMD", "kubectl", "get", "nodes"]
      interval: 5s
      timeout: 5s
      retries: 30

  kube-seed:
    profiles: ["k8s"]
    image: rancher/k3s:v1.30.5-k3s1
    depends_on:
      k3s:
        condition: service_healthy
    environment:
      KUBECONFIG: /output/kubeconfig.yaml
    volumes:
      - kubeconfig:/output:ro
      - ./examples/k8s:/manifests:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until kubectl --server=https://k3s:6443 apply -f /manifests/demo-app.yaml; do sleep 3; done
        kubectl --server=https://k3s:6443 rollout status deployment/demo-app --timeout=180s
    restart: "no"

  chaos:
    profiles: ["k8s"]
    build: ./devforge-chaos
    depends_on:
      kube-seed:
        condition: service_completed_successfully
    environment:
      KUBECONFIG: /kube/kubeconfig.yaml
      KUBE_API_HOST: https://k3s:6443
      TARGET_NAMESPACE: default
      TARGET_SELECTOR: ${TARGET_SELECTOR:-}
      CHAOS_EXPERIMENTS: ${CHAOS_EXPERIMENTS:-pod-kill}   # pod-kill,cpu-stress,memory-stress,node-drain
      CHAOS_INTERVAL_SECONDS: ${CHAOS_INTERVAL_SECONDS:-60}
      CHAOS_DURATION_SECONDS: ${CHAOS_DURATION_SECONDS:-30}
      CHAOS_MAX_TARGETS: ${CHAOS_MAX_TARGETS:-1}
      CHAOS_DRY_RUN: ${CHAOS_DRY_RUN:-false}
      CHAOS_ALLOW_SINGLE_NODE_DRAIN: ${CHAOS_ALLOW_SINGLE_NODE_DRAIN:-false}
    volumes:
      - kubeconfig:/kube:ro
      - ./reports:/reports
    restart: on-failure

volumes:
  gitea-data:
  qdrant-data:
  webhook-data:
  ollama-data:
  grafana-data:
  kubeconfig:
